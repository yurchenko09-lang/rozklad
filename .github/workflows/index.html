<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Розклад</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f3efe4;
    --surface:#fffdf8;
    --surface-2:#ece5d4;
    --text:#221e16;
    --text-dim:#726a58;
    --border:#e1d8c3;
    --earth:#3c6e50;
    --earth-ink:#2a4d39;
    --today-border:#221e16;
    --today-bg:#efe6cf;
    --neutral-bg:#e7e3d8;
    --neutral-text:#8b8376;
    --chip-sat:52%;
    --chip-light-bg:88%;
    --chip-light-ink:28%;
    --chip-ink-sat:60%;
    --chip-dot-light:42%;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18160f;
      --surface:#211d15;
      --surface-2:#2a251a;
      --text:#f1ebda;
      --text-dim:#b0a68e;
      --border:#3a3323;
      --earth:#7fbf96;
      --earth-ink:#a9dcbb;
      --today-border:#f1ebda;
      --today-bg:#332c1c;
      --neutral-bg:#2a2a26;
      --neutral-text:#8f8879;
      --chip-sat:46%;
      --chip-light-bg:24%;
      --chip-light-ink:84%;
      --chip-ink-sat:50%;
      --chip-dot-light:64%;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18160f;
    --surface:#211d15;
    --surface-2:#2a251a;
    --text:#f1ebda;
    --text-dim:#b0a68e;
    --border:#3a3323;
    --earth:#7fbf96;
    --earth-ink:#a9dcbb;
    --today-border:#f1ebda;
    --today-bg:#332c1c;
    --neutral-bg:#2a2a26;
    --neutral-text:#8f8879;
    --chip-sat:46%;
    --chip-light-bg:24%;
    --chip-light-ink:84%;
    --chip-ink-sat:50%;
    --chip-dot-light:64%;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    padding:28px 16px 64px;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  header{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  h1{
    font-family:"Bitter", Georgia, serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 38px);
    margin:0;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    align-items:center;
    font-size:12.5px;
    color:var(--text-dim);
    min-height:18px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:3px;
    flex:none;
    background:hsl(var(--chip-hue, 210) 55% var(--chip-dot-light));
  }
  .legend-hint{font-style:italic;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .filter{
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--surface);
    position:relative;
  }
  .filter > summary{
    cursor:pointer;
    padding:9px 13px;
    font-size:13px;
    font-weight:600;
    list-style:none;
    display:flex;
    align-items:center;
    gap:6px;
    border-radius:9px;
  }
  .filter > summary::-webkit-details-marker{display:none;}
  .filter > summary .count{
    font-family:"IBM Plex Mono", monospace;
    font-weight:400;
    color:var(--text-dim);
    font-size:12px;
  }
  .filter[open] > summary{border-bottom:1px solid var(--border);}
  .filter-panel{
    position:absolute;
    z-index:10;
    top:100%;
    left:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 9px 9px;
    min-width:240px;
    padding:6px 4px 0;
    display:flex;
    flex-direction:column;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
  }
  .filter-search{
    margin:2px 5px 6px;
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
  }
  .filter-search:focus{outline:2px solid var(--earth-ink); outline-offset:1px;}
  .filter-list{
    max-height:260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:1px;
    padding-bottom:4px;
  }
  .filter-actions{
    display:flex;
    gap:14px;
    font-size:11.5px;
    padding:6px 12px 8px;
    border-top:1px solid var(--border);
    margin-top:4px;
  }
  .filter-actions button{
    background:none;
    border:none;
    color:var(--earth-ink);
    cursor:pointer;
    font-size:11.5px;
    padding:0;
    text-decoration:underline;
    font-family:inherit;
  }
  .filter-panel label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-panel label:hover{background:var(--surface-2);}
  .filter-panel input[type="checkbox"]{accent-color:var(--earth);}

  .meta-line{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--text-dim);
  }

  .table-scroll{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
  }
  th, td{
    text-align:left;
    vertical-align:top;
    padding:9px 12px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  th:last-child, td:last-child{border-right:none;}
  tbody tr:last-child td{border-bottom:none;}
  td{white-space:normal;}

  .pair-col{
    position:sticky;
    left:0;
    z-index:3;
    background:var(--surface);
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    min-width:74px;
    white-space:nowrap;
  }
  thead th.pair-col{z-index:4;}

  thead th{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--surface);
    min-width:230px;
    white-space:nowrap;
  }
  .col-head{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .col-date{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:600;
  }
  .col-weekday{
    font-family:"Bitter", Georgia, serif;
    font-weight:600;
    font-size:13px;
    color:var(--text-dim);
  }
  .col-badge{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:600;
    color:var(--text-dim);
    min-height:12px;
  }
  th.today, td.today{background:var(--today-bg);}
  th.today .col-date, th.today .col-badge{color:var(--text);}
  th.past, td.past{background:var(--neutral-bg);}
  th.past .col-date, th.past .col-weekday{color:var(--neutral-text);}
  th.nodata, td.nodata{background:var(--neutral-bg);}
  th.nodata .col-badge{color:var(--neutral-text); font-style:italic;}

  .cell-dash{color:var(--text-dim); font-family:"IBM Plex Mono", monospace;}
  .cell-stack{display:flex; flex-direction:column; gap:5px;}

  .pair-chip{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:4px 6px;
    border-radius:7px;
    padding:4px 8px;
    font-size:13px;
    background:hsl(var(--chip-hue, 210) var(--chip-sat) var(--chip-light-bg));
    color:hsl(var(--chip-hue, 210) var(--chip-ink-sat) var(--chip-light-ink));
  }
  .pair-chip .grp{font-weight:600; white-space:nowrap;}
  .pair-chip .subj{
    flex:1 1 auto;
    min-width:12ch;
  }
  .pair-chip .room{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    opacity:.8;
    white-space:nowrap;
  }

  th.collapsible{cursor:pointer;}
  thead th.collapsed, td.collapsed{min-width:0 !important; width:46px; padding-left:8px; padding-right:8px;}
  th.collapsed .col-weekday{display:none;}
  th.collapsed .col-date{font-size:11.5px; display:flex; align-items:center; gap:2px;}
  .collapse-toggle{
    font-size:10px;
    color:var(--text-dim);
    margin-left:4px;
  }
  .mini-chip{
    display:inline-block;
    font-size:10.5px;
    padding:2px 5px;
    border-radius:5px;
    background:hsl(var(--chip-hue, 210) var(--chip-sat) var(--chip-light-bg));
    color:hsl(var(--chip-hue, 210) var(--chip-ink-sat) var(--chip-light-ink));
    margin:1px 2px 1px 0;
    cursor:default;
  }
  .mini-wrap{display:flex; flex-wrap:wrap;}

  .skeleton{
    color:var(--text-dim);
    font-size:14px;
    padding:20px 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Розклад</h1>
    <div class="legend" id="legendHost"></div>
  </header>

  <div class="filters">
    <details class="filter" id="filterGroups">
      <summary>Групи <span class="count"></span></summary>
      <div class="filter-panel"></div>
      <div class="filter-actions">
        <button data-act="all">Обрати всі</button>
        <button data-act="none">Очистити</button>
      </div>
    </details>
    <details class="filter" id="filterSubjects">
      <summary>Предмети <span class="count"></span></summary>
      <div class="filter-panel"></div>
      <div class="filter-actions">
        <button data-act="all">Обрати всі</button>
        <button data-act="none">Очистити</button>
      </div>
    </details>
  </div>

  <div id="tableHost" class="table-scroll">
    <div class="skeleton">Завантаження розкладу…</div>
  </div>

  <div class="meta-line" id="metaLine"></div>
  <div class="meta-line" id="updatedLine"></div>
</div>

<script>
  const WEEKDAY_FULL = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  const KYIV_TZ = "Europe/Kyiv";
  const YEAR_START = "2026-09-01";
  const YEAR_END = "2027-07-01";
  const ALL_PAIRS = [1,2,3,4,5,6];
  const DATA_URL = "./data/schedule.json";

  let ALL_DOCS = [];
  let selGroups = new Set();
  let selSubjects = new Set();
  let collapsedDates = null;
  const seenDates = new Set();

  function todayKyivISO(){
    const parts = new Intl.DateTimeFormat("en-CA", {timeZone: KYIV_TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date());
    const y = parts.find(p=>p.type==="year").value;
    const m = parts.find(p=>p.type==="month").value;
    const d = parts.find(p=>p.type==="day").value;
    return y+"-"+m+"-"+d;
  }
  const TODAY_ISO = todayKyivISO();

  function fmtDate(iso){
    const [y,m,d] = iso.split("-");
    return d+"."+m;
  }
  function weekdayFull(iso){
    const dt = new Date(iso+"T12:00:00Z");
    return WEEKDAY_FULL[dt.getUTCDay()];
  }
  function dayStatus(iso){
    if(iso === TODAY_ISO) return "today";
    return iso < TODAY_ISO ? "past" : "future";
  }
  function formatUpdatedAt(iso){
    if(!iso) return "";
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    const parts = new Intl.DateTimeFormat("uk-UA", {
      timeZone: KYIV_TZ, day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"
    }).formatToParts(d);
    const get = t => (parts.find(p=>p.type===t)||{}).value || "";
    return get("day")+"."+get("month")+"."+get("year")+", "+get("hour")+":"+get("minute");
  }
  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h % 360;
  }
  const subjectHueCache = new Map();
  function colorForSubject(subject){
    const key = subject || "";
    if(!subjectHueCache.has(key)) subjectHueCache.set(key, hashHue(key));
    return subjectHueCache.get(key);
  }

  function collectFacets(docs){
    const groups = new Set(), subjects = new Set();
    docs.forEach(doc => (doc.entries||[]).forEach(e => {
      if(e.group) groups.add(e.group);
      if(e.subject) subjects.add(e.subject);
    }));
    return {
      groups: Array.from(groups).sort((a,b)=>a.localeCompare(b,"uk")),
      subjects: Array.from(subjects).sort((a,b)=>a.localeCompare(b,"uk"))
    };
  }

  function buildFilterPanel(hostId, items, selectedSet, onChange){
    const host = document.getElementById(hostId);
    const panel = host.querySelector(".filter-panel");
    const countEl = host.querySelector(".count");
    panel.innerHTML = "";

    let searchInput = null;
    if(items.length > 6){
      searchInput = document.createElement("input");
      searchInput.type = "text";
      searchInput.className = "filter-search";
      searchInput.placeholder = "Пошук…";
      panel.appendChild(searchInput);
    }

    const list = document.createElement("div");
    list.className = "filter-list";
    panel.appendChild(list);

    const rows = [];
    items.forEach(item => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selectedSet.has(item);
      cb.addEventListener("change", () => {
        if(cb.checked) selectedSet.add(item); else selectedSet.delete(item);
        countEl.textContent = selectedSet.size ? "("+selectedSet.size+")" : "";
        onChange();
      });
      const span = document.createElement("span");
      span.textContent = item;
      label.appendChild(cb);
      label.appendChild(span);
      list.appendChild(label);
      rows.push({label, text: item.toLowerCase()});
    });
    countEl.textContent = selectedSet.size ? "("+selectedSet.size+")" : "";

    if(searchInput){
      searchInput.addEventListener("click", (ev) => ev.stopPropagation());
      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        rows.forEach(({label, text}) => { label.style.display = (!q || text.indexOf(q) !== -1) ? "" : "none"; });
      });
    }

    const actionsWrap = host.querySelector(".filter-actions");
    if(actionsWrap) actionsWrap.querySelectorAll("button").forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const act = btn.getAttribute("data-act");
        if(act === "all"){ items.forEach(i=>selectedSet.add(i)); }
        else if(act === "none"){ selectedSet.clear(); }
        list.querySelectorAll("input[type=checkbox]").forEach((cb,idx) => cb.checked = selectedSet.has(items[idx]));
        countEl.textContent = selectedSet.size ? "("+selectedSet.size+")" : "";
        onChange();
      };
    });
  }

  function passesFilter(e){
    if(selGroups.size === 0 && selSubjects.size === 0) return false;
    if(selGroups.size && !selGroups.has(e.group)) return false;
    if(selSubjects.size && !selSubjects.has(e.subject)) return false;
    return true;
  }

  function renderChip(entry){
    const room = entry.room && entry.room !== "-" ? entry.room : "—";
    const span = document.createElement("span");
    span.className = "pair-chip";
    span.style.setProperty("--chip-hue", colorForSubject(entry.subject));
    span.innerHTML =
      '<span class="grp">'+entry.group+'</span>' +
      '<span class="subj" title="'+(entry.subject||"").replace(/"/g,"&quot;")+'">'+(entry.subject||"")+'</span>' +
      '<span class="room">'+room+'</span>';
    return span;
  }

  function renderLegend(subjects){
    const host = document.getElementById("legendHost");
    host.innerHTML = "";
    if(!subjects.length){
      const hint = document.createElement("span");
      hint.className = "legend-hint";
      hint.textContent = "Оберіть групи або предмети у фільтрах вище, щоб побачити розклад.";
      host.appendChild(hint);
      return;
    }
    subjects.forEach(subj => {
      const item = document.createElement("span");
      item.className = "legend-item";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--chip-hue", colorForSubject(subj));
      item.appendChild(dot);
      item.appendChild(document.createTextNode(subj));
      host.appendChild(item);
    });
  }

  function buildTable(docs){
    const inRange = docs.filter(d => d.date >= YEAR_START && d.date <= YEAR_END);
    inRange.sort((a,b) => b.date.localeCompare(a.date));

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");

    const cornerTh = document.createElement("th");
    cornerTh.className = "pair-col";
    cornerTh.textContent = "Пара";
    headRow.appendChild(cornerTh);

    inRange.forEach(doc => {
      const status = dayStatus(doc.date);
      const isCollapsed = collapsedDates.has(doc.date);
      const th = document.createElement("th");
      th.className = status + (doc.status === "no_data" ? " nodata" : "") + " collapsible" + (isCollapsed ? " collapsed" : "");
      const badgeText = doc.status === "no_data" ? "немає даних" : status === "today" ? "сьогодні" : "";
      th.innerHTML =
        '<div class="col-head">' +
          '<span class="col-date">'+fmtDate(doc.date)+(isCollapsed ? '<span class="collapse-toggle">▸</span>' : '<span class="collapse-toggle">▾</span>')+'</span>' +
          '<span class="col-weekday">'+(doc.weekday || weekdayFull(doc.date))+'</span>' +
          '<span class="col-badge">'+badgeText+'</span>' +
        '</div>';
      th.addEventListener("click", () => {
        if(collapsedDates.has(doc.date)) collapsedDates.delete(doc.date); else collapsedDates.add(doc.date);
        draw();
      });
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    ALL_PAIRS.forEach(pairNum => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.className = "pair-col";
      th.scope = "row";
      th.textContent = "Пара " + pairNum;
      tr.appendChild(th);

      inRange.forEach(doc => {
        const status = dayStatus(doc.date);
        const isCollapsed = collapsedDates.has(doc.date);
        const td = document.createElement("td");
        td.className = status + (doc.status === "no_data" ? " nodata" : "") + (isCollapsed ? " collapsed" : "");
        const entries = (Array.isArray(doc.entries) ? doc.entries : [])
          .filter(e => e.pair === pairNum && passesFilter(e));
        if(entries.length && isCollapsed){
          const wrap = document.createElement("div");
          wrap.className = "mini-wrap";
          entries.forEach(e => {
            const span = document.createElement("span");
            span.className = "mini-chip";
            span.style.setProperty("--chip-hue", colorForSubject(e.subject));
            span.textContent = e.group;
            span.title = e.group + " — " + (e.subject||"") + " — ауд. " + (e.room && e.room !== "-" ? e.room : "—");
            wrap.appendChild(span);
          });
          td.appendChild(wrap);
        } else if(entries.length){
          const stack = document.createElement("div");
          stack.className = "cell-stack";
          entries.forEach(e => stack.appendChild(renderChip(e)));
          td.appendChild(stack);
        } else if(doc.status === "no_data"){
          if(!isCollapsed) td.innerHTML = '<span class="cell-dash">?</span>';
        } else if(!isCollapsed){
          td.innerHTML = '<span class="cell-dash">—</span>';
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function draw(){
    const host = document.getElementById("tableHost");
    host.innerHTML = "";
    if(!ALL_DOCS.length){
      const p = document.createElement("div");
      p.className = "skeleton";
      p.textContent = "Поки немає жодного запису.";
      host.appendChild(p);
      renderLegend([]);
      return;
    }
    host.appendChild(buildTable(ALL_DOCS));

    const visibleSubjects = new Set();
    ALL_DOCS.forEach(doc => (doc.entries||[]).forEach(e => {
      if(passesFilter(e)) visibleSubjects.add(e.subject || "");
    }));
    renderLegend(Array.from(visibleSubjects).filter(Boolean).sort((a,b)=>a.localeCompare(b,"uk")));
  }

  document.addEventListener("click", (ev) => {
    document.querySelectorAll(".filter[open]").forEach(d => {
      if(!d.contains(ev.target)) d.open = false;
    });
  });

  function setupFilters(){
    const facets = collectFacets(ALL_DOCS);
    if(collapsedDates === null){
      collapsedDates = new Set(ALL_DOCS.filter(d => dayStatus(d.date) === "past").map(d => d.date));
    } else {
      ALL_DOCS.forEach(d => {
        if(dayStatus(d.date) === "past" && !seenDates.has(d.date)) collapsedDates.add(d.date);
      });
    }
    ALL_DOCS.forEach(d => seenDates.add(d.date));
    buildFilterPanel("filterGroups", facets.groups, selGroups, draw);
    buildFilterPanel("filterSubjects", facets.subjects, selSubjects, draw);
  }

  async function main(){
    const metaEl = document.getElementById("metaLine");
    const updatedEl = document.getElementById("updatedLine");
    metaEl.textContent = "сьогодні " + TODAY_ISO;

    try{
      const res = await fetch(DATA_URL, {cache: "no-store"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const store = await res.json();
      const days = store.days || {};
      ALL_DOCS = Object.keys(days).map(k => days[k]);
      updatedEl.textContent = store.updatedAt ? "Оновлено: " + formatUpdatedAt(store.updatedAt) : "";
      metaEl.textContent = "Автоматичне оновлення з Google Таблиць · сьогодні " + TODAY_ISO;
    }catch(e){
      metaEl.textContent = "Не вдалося завантажити дані розкладу (" + e.message + ").";
      ALL_DOCS = [];
    }

    setupFilters();
    draw();
  }

  main();
</script>
